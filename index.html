<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Long Vowel World 🚀</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --pink: #f8a5c2; --blue: #bde0fe; --bg: #fffbe6; --gold: #feca57; --accent: #54a0ff; --green: #58cc02; }
        body { font-family: sans-serif; background-color: var(--bg); text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: auto; padding: 25px; background: white; border-radius: 40px; box-shadow: 0 10px 0 #f0e68c; min-height: 90vh; }
        .header { color: #1d3557; font-size: 28px; font-weight: bold; margin-bottom: 10px; }
        .stars { font-size: 40px; color: var(--gold); margin-bottom: 15px; min-height: 50px; text-shadow: 1px 1px #888; }
        
        /* 選單樣式 */
        .vowel-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .vowel-item { padding: 25px 10px; background: #e3f2fd; color: #1976D2; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 24px; border: 1px solid #bbdefb; box-shadow: 0 5px #90caf9; }
        
        /* 遊戲按鈕樣式 */
        .choice-container { display: flex; justify-content: space-around; margin: 30px 0; min-height: 160px; }
        .circle-btn { width: 140px; height: 140px; border-radius: 50%; border: 6px solid white; font-size: 28px; font-weight: bold; cursor: pointer; box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .circle-btn.pink { background-color: var(--pink); color: #ad1457; }
        .circle-btn.blue { background-color: var(--blue); color: #0288d1; }
        
        /* 下方控制按鈕樣式 (同 Mid Sight Words) */
        #controls { display: flex; flex-direction: column; align-items: center; gap: 12px; width: 100%; margin-top: 20px; }
        .action-btn { padding: 15px 30px; border-radius: 50px; border: 2px solid #ddd; background-color: #fff; font-size: 18px; font-weight: bold; width: 90%; max-width: 350px; cursor: pointer; }
        .record-btn { background-color: #ffd6a5; }
        .recording { background-color: #ff6b6b !important; color: white; animation: pulse 1s infinite; }
        .play-btn { background-color: #c1fba4; }
        .next-btn { background-color: var(--green); color: white; font-size: 22px; border: none; box-shadow: 0 4px 0 #3d8b02; }
        
        .hidden { display: none !important; }
        .victory-jump { animation: jump 0.5s ease infinite alternate; }
        @keyframes jump { from { transform: translateY(0); } to { transform: translateY(-10px); } }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div id="menu-view">
        <h2 class="header">Long Vowel World 🚀</h2>
        <div class="stars">✨✨✨</div>
        <p style="color: #888;">Pick a Sound to Start!</p>
        <div class="vowel-grid" id="vowel-menu"></div>
    </div>

    <div id="game-view" class="hidden">
        <div class="header" id="current-vowel-display">Long Vowel</div>
        <div id="star-display" class="stars">☆☆☆☆☆</div>
        
        <div id="question-area">
            <div class="choice-container">
                <button id="opt1" class="circle-btn pink" onclick="checkAnswer(this)"></button>
                <button id="opt2" class="circle-btn blue" onclick="checkAnswer(this)"></button>
            </div>
            <button class="action-btn" onclick="speak(currentTarget)">🔈 再聽一次老師唸</button>
        </div>

        <div id="feedback-area" class="hidden">
            <div id="controls">
                <button id="record-btn" class="action-btn record-btn" onclick="toggleRecording()">🎤 錄音練習</button>
                <button id="playRecBtn" class="action-btn play-btn hidden" onclick="playBack()">▶️ 聽我的聲音</button>
                <button class="action-btn next-btn" onclick="handleNextStep()">NEXT ➔</button>
            </div>
        </div>
        
        <button onclick="location.reload()" style="margin-top:40px; background:none; border:none; color:lightgray; cursor:pointer; font-size: 16px;">⬅ Back to Selection</button>
    </div>
</div>

<script>
    const victoryAudio = new Audio('https://www.myinstants.com/media/sounds/final-fantasy-vii-victory-fanfare-1.mp3');
    
    const longVowelsData = {
        'Long A': ["cake", "case", "game", "tape", "rain", "pail", "hay", "say", "wave", "tail", "pay", "mail", "wait", "day", "lake", "gate", "snake", "whale", "gray", "paint"],
        'Long E': ["bee", "see", "Eve", "Pete", "tea", "leaf", "sea", "read", "feet", "bean", "eat", "jeep", "reed", "seat", "pea", "green", "cheese", "tree", "meat", "sleep"],
        'Long I': ["bike", "kite", "rice", "mice", "night", "fight", "light", "right", "ice", "like", "knight", "pie", "lie", "tie", "five", "lime", "cry", "fly", "sky", "smile", "high"],
        'Long O': ["rose", "hose", "nose", "rope", "boat", "coat", "soap", "road", "coke", "bone", "toad", "home", "bowl", "row", "snow", "goat", "show", "slow", "cone", "note"],
        'Long U': ["cute", "mule", "cube", "huge", "glue", "blue", "fruit", "suit", "nude", "duke", "Sue", "cue", "fuel", "mute", "few", "pew", "tube", "june", "flute", "juice"]
    };

    let currentVowel = '', currentTarget = '', score = 0, isRecording = false;
    let mediaRecorder, audioChunks = [], audioUrl;

    const menuGrid = document.getElementById('vowel-menu');
    Object.keys(longVowelsData).forEach(v => {
        const div = document.createElement('div');
        div.className = 'vowel-item';
        div.innerText = v;
        div.onclick = () => {
            victoryAudio.play().then(() => {
                victoryAudio.pause();
                victoryAudio.currentTime = 0;
            }).catch(() => {});
            startLevel(v);
        };
        menuGrid.appendChild(div);
    });

    function startLevel(vowel) {
        currentVowel = vowel;
        score = 0;
        document.getElementById('menu-view').classList.add('hidden');
        document.getElementById('game-view').classList.remove('hidden');
        document.getElementById('current-vowel-display').innerText = vowel;
        nextRound();
    }

    function nextRound() {
        document.getElementById('question-area').classList.remove('hidden');
        document.getElementById('feedback-area').classList.add('hidden');
        document.getElementById('playRecBtn').classList.add('hidden');
        document.getElementById('record-btn').innerText = "🎤 錄音練習";
        document.getElementById('record-btn').classList.remove('recording');
        document.getElementById('star-display').classList.remove('victory-jump');
        
        const words = longVowelsData[currentVowel];
        currentTarget = words[Math.floor(Math.random() * words.length)];
        const others = Object.keys(longVowelsData).filter(v => v !== currentVowel);
        const distractorVowel = others[Math.floor(Math.random() * others.length)];
        const distractor = longVowelsData[distractorVowel][Math.floor(Math.random() * longVowelsData[distractorVowel].length)];
        
        const options = [currentTarget, distractor].sort(() => Math.random() - 0.5);
        document.getElementById('opt1').innerText = options[0];
        document.getElementById('opt2').innerText = options[1];
        updateStars();
        speak(currentTarget);
    }

    function speak(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'en-US'; m.rate = 0.7;
        window.speechSynthesis.speak(m);
    }

    function checkAnswer(el) {
        if (el.innerText === currentTarget) {
            score++;
            updateStars();
            confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
            document.getElementById('question-area').classList.add('hidden');
            document.getElementById('feedback-area').classList.remove('hidden');
        } else {
            speak("Try again: " + currentTarget);
        }
    }

    function handleNextStep() {
        if (score > 0 && score % 5 === 0) {
            confetti({ particleCount: 400, spread: 120, origin: { y: 0.5 } });
            document.getElementById('star-display').classList.add('victory-jump');
            victoryAudio.currentTime = 0;
            victoryAudio.play();
            setTimeout(() => {
                alert("🏆 Awesome! Level Up!");
                nextRound();
            }, 100);
        } else {
            nextRound();
        }
    }

    function updateStars() {
        let displayScore = score % 5;
        if (score > 0 && displayScore === 0) displayScore = 5;
        document.getElementById('star-display').innerText = "★".repeat(displayScore) + "☆".repeat(5 - displayScore);
    }

    async function toggleRecording() {
        const btn = document.getElementById('record-btn');
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    audioUrl = URL.createObjectURL(audioBlob);
                    document.getElementById('playRecBtn').classList.remove('hidden');
                };
                mediaRecorder.start();
                isRecording = true;
                btn.innerText = "正在錄音...";
                btn.classList.add('recording');
            } catch (err) { alert("請開啟麥克風權限"); }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            btn.innerText = "✅ 錄好了";
            btn.classList.remove('recording');
        }
    }

    function playBack() { if(audioUrl) new Audio(audioUrl).play(); }
</script>
</body>
</html>
